<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAAdlander Command Center</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Space Background -->
    <div class="space-background" aria-hidden="true">
        <div class="stars-container">
            <div class="stars stars-near"></div>
            <div class="stars stars-mid"></div>
        </div>
        <div class="meteors">
            <div class="meteor meteor-1"></div>
            <div class="meteor meteor-2"></div>
        </div>
    </div>

    <main class="page-layout">

        <!-- Small, Clean Header -->
        <header class="app-header glass-panel">
            <div class="logo-wrapper">
                <img src="assets/AASA_logo.withoutBackground.png" alt="AASA logo" class="aasa-logo">
            </div>
            <div class="header-text">
                <h1>AAAdlander Command Center</h1>
                <span class="group-badge">Group 14</span>
            </div>
        </header>

        <!-- Dashboard Component -->
        <plant-dashboard></plant-dashboard>

        <!-- Controls Panel  -->
        <section class="controls-panel glass-panel">
            <h2>Module Commands</h2>
            <div class="controls-wrapper">
                <action-button id="btn-start" theme="primary">Start Measurement</action-button>
                <action-button id="btn-plant" theme="success">Plant Flag</action-button>
                <action-button id="btn-reset" theme="danger">Reset</action-button>
            </div>
            <!-- Add these buttons to test your Arduino LED -->
            <button id="btn-led-on" class="btn">LED ON</button>
            <button id="btn-led-off" class="btn">LED OFF</button>
        </section>

    </main>

    <footer class="app-footer">
        <p>AAAdlander &copy; Group 14</p>
    </footer>

    <!-- Logic Scripts -->
    <script src="js/app.js" type="module"></script>

</body>

</html>
